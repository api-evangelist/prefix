name: PreFix
description: PreFix is a Techstars-backed residential home-maintenance service company operating
  in Austin, Dallas, Houston, San Antonio, and Denver. For a flat monthly membership, homeowners
  get a dedicated neighborhood Home Manager who handles general repairs, twice-yearly 30-point
  preventive maintenance, HVAC, plumbing, carpentry, painting, appliance and garage-door work,
  and vetted contractor management through a single email, call, or text. Customers manage their
  homes through the HomeHub member portal. PreFix operates a consumer home-services business and
  does not publish a public developer API, developer portal, or machine-readable API surface; this
  profile is maintained in the API Evangelist network for company and demand-side intelligence.
